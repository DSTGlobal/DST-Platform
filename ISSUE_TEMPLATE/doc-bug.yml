name: "🐛 Ошибка в документации"
description: "Сообщите об ошибке, опечатке или неточности в документации"
title: "[DOCS] "
labels: ["documentation", "bug"]
assignees: []

body:
  - type: "markdown"
    attributes:
      value: |
        Спасибо за помощь в улучшении документации DST Platform!
        Пожалуйста, заполните эту форму как можно подробнее.

  - type: "dropdown"
    id: "doc-type"
    attributes:
      label: "Тип проблемы"
      description: "Что именно не так?"
      options:
        - "Опечатка или грамматическая ошибка"
        - "Неточная или устаревшая информация"
        - "Отсутствующая информация"
        - "Некорректный пример кода"
        - "Неверная ссылка"
        - "Проблемы с форматированием"
        - "Другое"
    validations:
      required: true

  - type: "input"
    id: "doc-section"
    attributes:
      label: "Раздел документации"
      description: "В каком файле или разделе найдена ошибка?"
      placeholder: "Например: 7. Паттерн MVC и жизненный цикл запроса.md"
    validations:
      required: true

  - type: "input"
    id: "page-url"
    attributes:
      label: "Ссылка на страницу (если есть)"
      description: "URL страницы, если документация опубликована онлайн"
      placeholder: "https://dstglobal.ru"

  - type: "textarea"
    id: "current-content"
    attributes:
      label: "Текущее содержимое"
      description: "Скопируйте текст с ошибкой или сделайте скриншот"
      placeholder: |
        Например:
        ```
        Контроллер организует обработку запроса через **методы действий**.
        
        ### Соглашение об именовании
        - Метод действия: `action{ActionName}` → `/shop/item` → `actionItem()`
        - Параметры передаются как аргументы: `actionItem($id)`
        ```

  - type: "textarea"
    id: "expected-content"
    attributes:
      label: "Ожидаемое содержимое"
      description: "Как должно быть правильно?"
      placeholder: |
        Например:
        ```
        Контроллер организует обработку запроса через **методы действий**.
        
        ### Соглашение об именовании
        - Метод действия: `action{ActionName}` → `/shop/item` → `actionItem()`
        - Параметры передаются как аргументы: `actionItem($id)`
        ```

  - type: "dropdown"
    id: "severity"
    attributes:
      label: "Серьёзность ошибки"
      description: "Насколько критична эта ошибка?"
      options:
        - "Критическая (полностью мешает пониманию)"
        - "Серьёзная (создаёт путаницу)"
        - "Средняя (незначительная неточность)"
        - "Незначительная (опечатка)"

  - type: "textarea"
    id: "additional-context"
    attributes:
      label: "Дополнительный контекст"
      description: "Любая дополнительная информация, которая может помочь"
      placeholder: "Например: 'Это противоречит информации в разделе 5.2' или 'В последней версии API изменился синтаксис'"

  - type: "checkboxes"
    id: "terms"
    attributes:
      label: "Подтверждение"
      description: "Пожалуйста, подтвердите следующее"
      options:
        - label: "Я проверил, что эта ошибка ещё не была зарегистрирована"
          required: true
        - label: "Я согласен, что мой вклад будет лицензирован под CC BY-SA 4.0"
          required: true
        - label: "Я не сообщаю о проблемах в коммерческих аспектах (для этого используйте официальные каналы поддержки)"
          required: true

  - type: "markdown"
    attributes:
      value: |
        ## Что будет дальше?
        
        1. Мы рассмотрим ваш issue в течение 3 рабочих дней
        2. При необходимости зададим уточняющие вопросы
        3. Исправим ошибку и обновим документацию
        4. Закроем issue с комментарием о внесённых изменениях
        
        Спасибо за ваш вклад в улучшение документации DST Platform!
